<!DOCTYPE html>
<html lang="{{.Language}}" data-theme="{{.Theme}}" data-font-size="{{.FontSize}}" data-font-preset="{{.FontPreset}}" data-show-background-dots="{{.ShowBackgroundDots}}" data-enable-custom-font="{{.EnableCustomFont}}" data-custom-font-path="{{.CustomFontPath}}" data-lang="{{.Language}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if and .EnableCustomTitle .CustomTitle}}{{.CustomTitle}}{{else}}Dashboard{{end}}</title>
    <script src="/static/js/font-presets.js"></script>
    <script src="/static/js/theme-loader.js"></script>
    <link rel="icon" type="image/x-icon" href="{{if and .EnableCustomFavicon .CustomFaviconPath}}{{.CustomFaviconPath}}{{else}}/static/favicon.ico{{end}}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="{{if and .EnableCustomFavicon .CustomFaviconPath}}{{.CustomFaviconPath}}{{else}}/static/nextdash-logo.png{{end}}">
    <meta name="theme-color" content="{{if eq .Theme "light"}}#2563eb{{else}}#60a5fa{{end}}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{if and .EnableCustomTitle .CustomTitle}}{{.CustomTitle}}{{else}}nextDash{{end}}">
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="apple-touch-icon" href="{{if and .EnableCustomFavicon .CustomFaviconPath}}{{.CustomFaviconPath}}{{else}}/static/nextdash-logo.png{{end}}">
    <meta name="theme-color" content="{{if eq .Theme "light"}}#2563eb{{else}}#60a5fa{{end}}">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="{{if and .EnableCustomTitle .CustomTitle}}{{.CustomTitle}}{{else}}nextDash{{end}}">
    <link rel="stylesheet" href="/api/theme.css">
    <link rel="stylesheet" href="/static/css/theme.css">
    <link rel="stylesheet" href="/static/css/dashboard.css">
    <link rel="stylesheet" href="/static/css/modal.css">
    <link rel="stylesheet" href="/static/css/app-notification.css">
    <link rel="stylesheet" href="/static/css/search.css">
    <link rel="stylesheet" href="/static/css/search-commands-new.css">
    <link rel="stylesheet" href="/static/css/bookmark-form-preview.css">
    <link rel="stylesheet" href="/static/css/search-commands-note.css">
    <link rel="stylesheet" href="/static/css/status.css">
    <link rel="stylesheet" href="/static/css/select.css">
    <link rel="stylesheet" href="/static/css/font-size.css">
    <link rel="stylesheet" href="/static/css/responsive.css">
    <link rel="stylesheet" href="/static/css/dashboard-enhancements.css">
    <link rel="stylesheet" href="/static/css/skeleton-loading.css">
    <link rel="stylesheet" href="/static/css/onboarding.css">
    <link rel="stylesheet" href="/static/css/config-general-tour.css">
    <link rel="stylesheet" href="/static/css/discoverability-queue.css">
    <link rel="stylesheet" href="/static/css/feature-tour.css">
    <link rel="stylesheet" href="/static/css/guided-flow-guard.css">
    <link rel="stylesheet" href="/static/css/feature-spotlight.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="stylesheet" href="/static/css/enhanced-features.css">
    <link rel="stylesheet" href="/static/css/mobile-experience.css">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Source+Code+Pro:wght@400;600;900&display=swap" rel="stylesheet">
</head>
<body class="{{.Theme}} font-size-{{.FontSize}} loading" data-theme="{{.Theme}}" data-show-background-dots="{{.ShowBackgroundDots}}" data-show-title="{{.ShowTitle}}">
    <a class="skip-to-content" href="#dashboard-layout" data-i18n="dashboard.skipToContent">Skip to bookmarks</a>
    <!-- Container 1: Date, tabs, config button -->
    <div class="dashboard-section section-controls">
        <div class="container">
            <div class="header-top">
                <div class="header-top-primary skeleton-hide-while-loading">
                    <div id="date-element" class="date"></div>
                    <div id="dashboard-mini-status" class="dashboard-mini-status" aria-live="polite"></div>
                    <div id="status-loading-indicator" class="status-loading-indicator">
                        <span class="status-loading-text" data-i18n="dashboard.checkingStatus">checking status</span>
                        <span class="status-loading-dots"></span>
                    </div>
                </div>
                <div class="header-actions skeleton-hide-while-loading">
                    <button type="button" id="page-overview-header-btn" class="page-overview-header-btn" data-i18n="dashboard.pagesOverview">pages</button>
                    <div id="page-navigation" class="page-navigation">
                        <!-- Pages will be loaded here -->
                    </div>
                    {{if .ShowHealthDashboard}}<div class="health-link">
                        <a href="/health" data-i18n="dashboard.health">health</a>
                    </div>{{end}}
                    {{if .ShowConfigButton}}<div class="config-link">
                        <a href="/config" data-i18n="dashboard.config">config</a>
                    </div>{{end}}
                </div>
            </div>
        </div>
    </div>

    <!-- Container 2: Title -->
    <div class="dashboard-section section-title">
        <div class="container">
            <div class="title-wrapper skeleton-hide-while-loading">
                <h1 class="title"></h1>
            </div>
        </div>
    </div>

    <!-- Container 3: Bookmarks -->
    <div class="dashboard-section section-content">
        <div class="container">
            <main id="dashboard-layout" class="dashboard-grid" tabindex="-1" aria-busy="true" role="grid" aria-label="Bookmarks">
                <div class="skeleton-root skeleton-dashboard" data-skeleton-root aria-hidden="true">
                    <div class="skeleton-dashboard-col">
                        <div class="skeleton-shimmer skeleton-line skeleton-line--title"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row skeleton-bookmark-row--short"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row skeleton-bookmark-row--short"></div>
                    </div>
                    <div class="skeleton-dashboard-col">
                        <div class="skeleton-shimmer skeleton-line skeleton-line--title"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row skeleton-bookmark-row--short"></div>
                    </div>
                    <div class="skeleton-dashboard-col">
                        <div class="skeleton-shimmer skeleton-line skeleton-line--title"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row skeleton-bookmark-row--short"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                        <div class="skeleton-shimmer skeleton-bookmark-row"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <div id="shortcut-search" class="shortcut-search">
        <div class="search-container">
            <div class="search-prompt">
                <span class="search-prefix" data-mode="search">SEARCH</span>
                <span id="search-query" class="search-query"></span>
                <span class="search-cursor" data-i18n="dashboard.searchCursor">_</span>
            </div>
            <input type="text" id="search-input-mobile" class="search-input-mobile" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
            <div id="search-matches" class="search-matches"></div>
            <div class="search-mode-tabs" aria-label="Switch search mode">
                <button class="search-mode-tab" data-mode="search" type="button">
                    <span class="search-mode-tab-key">&gt;</span>
                    <span class="search-mode-tab-label">search</span>
                </button>
                <button class="search-mode-tab" data-mode="command" type="button">
                    <span class="search-mode-tab-key">:</span>
                    <span class="search-mode-tab-label">commands</span>
                </button>
                <button class="search-mode-tab" data-mode="finder" type="button">
                    <span class="search-mode-tab-key">?</span>
                    <span class="search-mode-tab-label">finders</span>
                </button>
            </div>
        </div>
    </div>

    <!-- Search and Finders Buttons -->
    <div class="button-container">
        <div id="button-hint-text" class="button-hint" aria-live="polite"></div>
        <div id="search-flow-hint" class="search-flow-hint" role="status" aria-live="polite" hidden>
            <span class="search-flow-hint-text"><span class="sfh-seg"><kbd class="search-flow-chip">&gt;</kbd><span class="sfh-seg-label" data-i18n="dashboard.searchLabel">search</span></span><span class="sfh-seg">&nbsp;·&nbsp;</span><span class="sfh-seg"><kbd class="search-flow-chip">:</kbd><span class="sfh-seg-label" data-i18n="dashboard.commandsLabel">commands</span></span><span class="sfh-seg">&nbsp;·&nbsp;</span><span class="sfh-seg"><kbd class="search-flow-chip">?</kbd><span class="sfh-seg-label" data-i18n="dashboard.findersLabel">finders</span></span><span class="sfh-seg">&nbsp;·&nbsp;</span><span class="sfh-seg"><kbd class="search-flow-chip">+</kbd><span class="sfh-seg-label" data-i18n="dashboard.addBookmarkShort">bookmark</span></span><span class="sfh-seg sfh-seg-swipe hidden">&nbsp;·&nbsp;</span><span class="sfh-seg sfh-seg-swipe hidden" data-i18n="dashboard.swipePagesHint">swipe pages</span></span>
        </div>
        <div class="btn-group btn-group-primary">
            <button id="quick-add-toolbar-btn" type="button" class="search-button search-button-labeled add-bookmark-button" data-i18n-aria="dashboard.addBookmarkAria" aria-label="Add bookmark" data-tooltip="+ bookmark">
                <span class="search-button-icon">+</span>
                <span class="search-button-label" data-i18n="dashboard.addBookmarkShort">bookmark</span>
            </button>
            <button id="search-button" type="button" class="search-button search-button-labeled" data-i18n="dashboard.searchAriaLabel" aria-label="Open search" data-tooltip="> search">
                <span class="search-button-icon" data-i18n="dashboard.searchPrefix">></span>
                <span class="search-button-label" data-i18n="dashboard.searchLabel">search</span>
            </button>
            <button id="commands-button" type="button" class="search-button search-button-labeled commands-button" aria-label="Open commands" data-tooltip=": commands">
                <span class="search-button-icon">:</span>
                <span class="search-button-label" data-i18n="dashboard.commandsLabel">commands</span>
            </button>
            <button id="finders-button" type="button" class="search-button search-button-labeled finders-button" aria-label="Open finders" data-tooltip="? finders">
                <span class="search-button-icon">?</span>
                <span class="search-button-label" data-i18n="dashboard.findersLabel">finders</span>
            </button>
        </div>
        <div class="btn-group btn-group-secondary">
            <button id="recent-bookmarks-button" type="button" class="search-button search-button-labeled recent-button" aria-label="Open recent bookmarks" data-tooltip="* recent bookmarks">
                <span class="search-button-icon">*</span>
                <span class="search-button-label" data-i18n="dashboard.recentLabel">recent</span>
            </button>
            <button id="help-button" type="button" class="search-button search-button-labeled help-button" aria-label="Open keyboard cheat sheet" data-tooltip="! keyboard cheatsheet">
                <span class="search-button-icon">!</span>
                <span class="search-button-label" data-i18n="dashboard.helpLabel">help</span>
            </button>
        </div>
    </div>

    <!-- Launcher view toggle FAB -->
    <button id="launcher-toggle-btn" class="launcher-toggle-btn"
            data-i18n-tooltip="config.launcherToggleLabel" data-tooltip="launcher view">
        <span class="launcher-toggle-icon">&#8862;</span>
    </button>

    <!-- What's new FAB (opposite corner from button bar) -->
    <button id="whats-new-btn" class="whats-new-btn" aria-label="What's new" data-tooltip="what's new">
        <svg class="whats-new-btn-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="18" height="18" fill="currentColor" aria-hidden="true">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
        </svg>
    </button>

    <script src="/static/js/tips-policy.js"></script>
    <script src="/static/js/modal.js"></script>
    <script src="/static/js/whats-new-modal.js"></script>
    <script src="/static/js/layout-utils.js"></script>
    <script src="/static/js/config/config-language.js"></script>
    <script src="/static/js/bookmark-form/bookmark-url-utils.js"></script>
    <script src="/static/js/bookmark-form/bookmark-preview-service.js"></script>
    <script src="/static/js/bookmark-form/bookmark-form-preview.js"></script>
    <script src="/static/js/search-commands/search-commands-new.js"></script>
    <script src="/static/js/search-commands/search-commands-remove.js"></script>
    <script src="/static/js/search-commands/search-commands-columns.js"></script>
    <script src="/static/js/search-commands/search-commands-fontsize.js"></script>
    <script src="/static/js/search-commands/search-commands-theme.js"></script>
    <script src="/static/js/search-commands/search-commands-note.js"></script>
    <script src="/static/js/search-commands.js"></script>
    <script src="/static/js/search-finders.js"></script>
    <script src="/static/js/fuzzy-search.js"></script>
    <script src="/static/js/search.js"></script>
    <script src="/static/js/status.js"></script>
    <script src="/static/js/keyboard-navigation.js"></script>
    <script src="/static/js/swipe-navigation.js"></script>
    <script src="/static/js/hypr-mode.js"></script>
    <script src="/static/js/reorder.js"></script>
    <script src="/static/js/guided-flow-guard.js"></script>
    <script src="/static/js/onboarding.js"></script>
    <script src="/static/js/feature-tour.js"></script>
    <script src="/static/js/config-bookmarks-tour.js"></script>
    <script src="/static/js/feature-spotlight.js"></script>
    <script src="/static/js/weather.js"></script>
    <script src="/static/js/tag-autocomplete.js"></script>
    <script src="/static/js/quick-add.js"></script>
    <script src="/static/js/skeleton-loading.js"></script>
    <script src="/static/js/shortcut-format.js"></script>
    <script src="/static/js/discoverability-queue.js"></script>
    <script src="/static/js/app-notification.js"></script>
    <script src="/static/js/pwa-install-hint.js"></script>
    <script src="/static/js/mobile-experience.js"></script>
    <script src="/static/js/dashboard-deep-link.js"></script>
    <script src="/static/js/dashboard.js"></script>
    <script src="/static/js/analytics.js"></script>
    <script>
        // Load translations
        document.addEventListener('DOMContentLoaded', async () => {
            const language = new ConfigLanguage();
            const lang = document.documentElement.getAttribute('data-lang') || 'en';
            await language.loadTranslations(lang);
        });
    </script>
</body>
</html>
