# Production Docker Compose — assets served from the image embed (no static/templates mounts).
# Use docker-compose.yml for local dev (live CSS/JS from ./static without rebuild).
services:
  nextdash:
    build:
      context: .
      args:
        # See docker-compose.yml: derived by the Makefile from
        # scripts/version-from-index.sh, falls back to "dev" when unset.
        VERSION: ${VERSION:-dev}
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # ---------------------------------------------------------------------
      # System widgets (Processor, Disks) -- both mounts are read-only.
      #
      # Commented out so this file starts anywhere: a bind mount whose source
      # does not exist stops the container from starting at all. Uncomment what
      # applies to your host.
      #
      # Processor: a container shares the host kernel, so /proc/stat already
      # counts the host's CPU. Mount this to be explicit about which /proc is
      # read, or where the container sees a different one.
      # - /proc:/host/proc:ro
      #
      # Disks: required. A container can only measure what is mounted into it,
      # so without this the tile reports its own overlay rather than your
      # array. Mount the disks *under* NEXTDASH_HOST_ROOT keeping their own
      # names, so the paths typed in the widget are the host's own:
      #
      #   Unraid / most Linux:  - /mnt:/host/root/mnt:ro,rslave
      #   Synology / QNAP:      - /volume1:/host/root/volume1:ro,rslave
      #   Everything:           - /:/host/root:ro,rslave
      #
      # On Unraid these are template rows: Config Type Path, Container Path
      # /host/root/mnt, Host Path /mnt, Access Mode Read Only.
      # - /mnt:/host/root/mnt:ro,rslave
      #
      # Containers: the Docker socket. Read-only still exposes the daemon's
      # whole read API -- every container, image, environment and mount --
      # so add it only if that is acceptable, or point a socket proxy here.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
      # ---------------------------------------------------------------------
    environment:
      - PORT=8080
      # Where the mounts above landed. Unset means that source is not
      # available and the widget says so, rather than reporting a wrong number.
      # NEXTDASH_HOST_ROOT is the prefix without the host's own tree: mounting
      # /mnt at /host/root/mnt means the root is /host/root.
      # - NEXTDASH_HOST_PROC=/host/proc
      # - NEXTDASH_HOST_ROOT=/host/root
      # Containers widget: where the socket above landed. Unset hides the widget.
      # - NEXTDASH_DOCKER_SOCKET=/var/run/docker.sock
      # Turn the daily GitHub release check or the nextdash.cc news feed off for everyone.
      # - DISABLE_UPDATE_CHECK=true
      # - DISABLE_NEWS_FEED=true
      # Disable privacy-friendly usage analytics for the whole instance.
      # When true, nothing is sent and the Privacy toggle in Config is
      # disabled until this is unset again.
      # - DISABLE_TELEMETRY=true
      # LAN/VPS hardening (see README.md → Security):
      # - NEXTDASH_WRITE_TOKEN=change-me-to-a-long-random-string
      # - NEXTDASH_CORS_ORIGINS=https://dash.example.com,chrome-extension://your-extension-id
      # - NEXTDASH_ACTIVITY_LOG=mutate,status,security
      # - NEXTDASH_ACTIVITY_LOG_PERSIST=1
      # Capture (bookmarklet, share sheet, /add) without handing out the write token:
      # - NEXTDASH_CAPTURE_TOKEN=a-second-long-random-string
      # Automatic backups: how many are kept (1-50) and where (absolute path;
      # mount a volume there so they live outside ./data).
      # - NEXTDASH_AUTO_BACKUP_KEEP=3
      # - NEXTDASH_AUTO_BACKUP_DIR=/backups
      # Logging. The app's Config -> Logs wins over these once set there.
      # - NEXTDASH_LOG_LEVEL=info                    # error, warn, info, debug
      # - NEXTDASH_ACTIVITY_LOG_FORMAT=text          # or json, for Loki or Vector
      # - NEXTDASH_ACTIVITY_LOG_URLS=full            # full, host or off
      # - NEXTDASH_ACTIVITY_LOG_SAMPLE=open=0.1      # sampling per channel
      # - NEXTDASH_ACTIVITY_LOG_MAX_AGE_DAYS=30      # delete old rotated files
      # - NEXTDASH_ACTIVITY_OPEN_DETAIL=basic        # off, basic or full
      # Optional tuning (background CPU/network on small VPS):
      # - NEXTDASH_DISABLE_PREFETCH=1
      # - NEXTDASH_OUTBOUND_REQUESTS_PER_MIN=120
      # - NEXTDASH_SSRF_API_RATE_PER_MIN=60
      # - NEXTDASH_STATUS_PING_RATE_PER_MIN=300
      # - NEXTDASH_CSP=off
    restart: unless-stopped
    container_name: nextdash
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          memory: 64M
