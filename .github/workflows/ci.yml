name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate locale and whats-new JSON
        run: bash scripts/validate-json.sh
      - name: Check extension bookmark-form sync
        run: bash scripts/check-extension-bookmark-form.sh

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Check gofmt
        run: make fmt-check
      - name: Run Go tests
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: xvfb-run npm run test:e2e
