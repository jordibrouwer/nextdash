name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Validate locale and whats-new JSON
        run: bash scripts/validate-json.sh
      - name: Check extension bookmark-form sync
        run: bash scripts/check-extension-bookmark-form.sh
      # The node unit tests ran nowhere. news-stream-model asserted a feature
      # window of two for the month after the code moved to four, and nothing
      # said so — it only surfaced because it also broke the e2e run it was
      # being collected into. They cost seconds; the silence cost a release.
      - name: Run node unit tests
        run: npm run test:news-stream && npm run test:analytics-buckets && npm run test:search-groups
      # Eleven checks the repo already had and nothing ran. They are the
      # mechanism Scan 2's N5 asked for, left unplugged -- locale parity is held
      # by hand at 6011 keys across six files, and the v1.11.0 changelog even
      # says validate-tag-patterns "runs in CI", which it did not.
      #
      # Listed one per line rather than chained with &&, so a failure names
      # itself in the step that broke instead of in one long command.
      - name: Validate the cheat sheet
        run: npm run validate:cheatsheet-registry && npm run validate:cheatsheet-i18n
      - name: Validate help translations
        run: npm run validate:help-i18n
      - name: Validate locale parity
        run: npm run validate:locale-parity
      - name: Validate locale duplicates
        run: npm run validate:locale-duplicates
      - name: Validate locale placeholders
        run: npm run validate:locale-placeholders
      - name: Validate documentation links
        run: npm run validate:doc-links
      - name: Validate the overview feature list
        run: npm run validate:overview-features
      - name: Validate tag patterns
        run: npm run validate:tag-patterns
      - name: Run the model unit tests
        run: npm run test:workbench-model && npm run test:config-split

  go-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - name: Check gofmt
        run: make fmt-check
      - name: Run go vet
        run: go vet ./...
      - name: Run Go tests
        run: go test ./...

  e2e:
    runs-on: ubuntu-latest
    # Six runners, each with its own machine, its own `go run .` and its own
    # data directory -- which is also why sharding is safe here while raising
    # `workers` inside one runner is not: every spec in a run shares one server.
    #
    # The shards are left at Playwright's own split, by test count.
    #
    # They were weighted for a while, with PWTEST_SHARD_WEIGHTS, because the
    # `h`-`i` slice -- 47 health-* and 20 inbox-* files -- ran 24 minutes while
    # every other shard finished in five to eight. That slowness was not real:
    # those specs click the inbox and health destinations in the header, the
    # header folds them away below about 1500px, and Playwright's default window
    # is 1280 wide. Every one of those clicks waited its full thirty seconds.
    # One run carried 552 of those timeouts.
    #
    # playwright.config.js sets a wide viewport now, and the same 24 spec files
    # run in a minute. If a shard is ever the odd one out again, measure before
    # weighting: a shard that is slow because its tests are waiting cannot be
    # fixed by giving it fewer of them.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    name: e2e (${{ matrix.shard }}/6)
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.24'
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - name: Install Playwright
        run: npm ci && npx playwright install chromium --with-deps
      - name: Run Playwright tests
        run: xvfb-run npx playwright test --shard=${{ matrix.shard }}/6
      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: playwright-report/
          retention-days: 7
