name: Build and Publish Docker Image

# Runs whenever you publish a GitHub Release (e.g. v2026.08.02).
# Builds once and pushes the same image to both GHCR and Docker Hub.
on:
  release:
    types: [published]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/nextdash
  # Docker Hub account is under a different username than GitHub (foobar1452),
  # set as the DOCKERHUB_USERNAME repo secret — do not hardcode it here.
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nextdash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR using GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags/labels for both registries from the release tag.
      # nextDash uses calendar versioning (v2026.08.02, sometimes v2026.08.02.1),
      # which is NOT valid SemVer (leading zeros, 4 segments) — type=semver would
      # silently fail to match. type=ref just takes the tag name as-is.
      # A release tagged "v2026.08.02" produces:
      #   :v2026.08.02  :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
