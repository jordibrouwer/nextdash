name: Build and Publish Docker Image

# Runs whenever you publish a GitHub Release (e.g. v2026.08.02).
# Builds once and pushes the same image to both GHCR and Docker Hub.
on:
  release:
    types: [published]
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab too

env:
  GHCR_IMAGE: ghcr.io/${{ github.repository_owner }}/nextdash
  # Docker Hub account is under a different username than GitHub (foobar1452),
  # set as the DOCKERHUB_USERNAME repo secret — do not hardcode it here.
  DOCKERHUB_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/nextdash

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # needed to push to GHCR using GITHUB_TOKEN

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (for arm64 builds)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build the amd64 image once into the runner's Docker and scan it before
      # anything is pushed. A HIGH or CRITICAL finding that has a fix stops the
      # release here, so neither registry ever gets that image. arm64 is built
      # from the same Dockerfile and the same Alpine release, so one scan stands
      # for both. Build and push below reuses this build's layers from the cache.
      #
      # release-to-main.sh runs the same scan locally before it tags anything,
      # so a failure here means a CVE was published in the minutes between.
      # The tag and the GitHub Release already exist by then, and neither a
      # rerun (same commit, same finding) nor workflow_dispatch (no version
      # tag, only :latest) gets an image out. Fix the finding on dev and
      # release a new patch version.
      #
      # no-cache-filters: runtime rebuilds the final stage (apk add) every run,
      # so a fixed Alpine package is not hidden behind a cached layer while the
      # alpine:3.24 digest stays the same. The Go builder stage stays cached.
      - name: Build image for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: nextdash:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nextdash:scan
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
          format: table
          version: v0.75.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Derives tags/labels for both registries from the release tag.
      # nextDash uses calendar versioning (v2026.08.02, sometimes v2026.08.02.1),
      # which is NOT valid SemVer (leading zeros, 4 segments) — type=semver would
      # silently fail to match. type=ref just takes the tag name as-is.
      # A release tagged "v2026.08.02" produces:
      #   :v2026.08.02  :latest
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE }}
            ${{ env.DOCKERHUB_IMAGE }}
          tags: |
            type=ref,event=tag
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          no-cache-filters: runtime
