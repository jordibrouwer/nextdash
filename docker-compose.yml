# Development Docker Compose — mounts ./static, ./templates, ./locales for live assets without rebuild.
# For production from a checkout, use docker-compose.prod.yml (image assets only).
services:
  nextdash:
    build: .
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      # Dev: serve latest JS/CSS/locales from disk (main.go prefers on-disk static/locales)
      - ./static:/app/static
      - ./locales:/app/locales
      - ./templates:/app/templates
      # System widgets: the processor tile reads the machine through this
      # read-only mount. Without it nextDash reads its own container, so the
      # tile says so rather than reporting the wrong numbers.
      # - /proc:/host/proc:ro
      # The disks widget measures what is mounted into the container, so mount
      # the disks you want to watch *under* NEXTDASH_HOST_ROOT, keeping their
      # own names: /mnt stays /mnt below the prefix. On Unraid that covers the
      # array and cache; mount / to /host/root to reach disks outside it.
      # - /mnt:/host/root/mnt:ro,rslave
      - /proc:/host/proc:ro   
    environment:
      - PORT=8080
      # Live static mounts: re-hash assets on every read so ?v= tokens track edits.
      - NEXTDASH_STATIC_MUTABLE=1
      - NEXTDASH_HOST_PROC=/host/proc
      # - NEXTDASH_HOST_ROOT=/host/root
      # Disable privacy-friendly usage analytics for the whole instance.
      # When true, nothing is sent and the Privacy toggle in Config is
      # disabled until this is unset again.
      # - DISABLE_TELEMETRY=true
      # Optional: require X-NextDash-Token on destructive/write API calls (reset, import, colors reset, delete page, health write endpoints, clear/refresh previews)
      # - NEXTDASH_WRITE_TOKEN=change-me
    restart: unless-stopped
    container_name: nextdash
    
