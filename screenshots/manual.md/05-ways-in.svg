<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 324" width="720" height="324" role="img" aria-labelledby="t d"><title id="t">Ways to add a bookmark</title><desc id="d">Six ways in on one row: quick add with the ampersand key, the full form with plus or Shift and B, pasting a URL, the browser extension, the share sheet or bookmarklet or add address into the inbox, and an import. All of them end in the same bookmark, on a page and category or waiting in the inbox until you promote it with the same form. The form reads the page once for icon, name, preview card and suggested tags. The same address on the same page is refused, on another page you are asked, and imports skip duplicates. Dots travel down from each route; at rest the bookmark is lit.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,2%{opacity:0;transform:none}5%{opacity:1}12%{opacity:1;transform:translate(var(--x),var(--y))}15%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,9%{opacity:0;transform:none}12%{opacity:1}19%{opacity:1;transform:translate(var(--x),var(--y))}22%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes t3{0%,16%{opacity:0;transform:none}19%{opacity:1}26%{opacity:1;transform:translate(var(--x),var(--y))}29%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t3{animation:t3 8s ease-in-out infinite}@keyframes t4{0%,23%{opacity:0;transform:none}26%{opacity:1}33%{opacity:1;transform:translate(var(--x),var(--y))}36%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t4{animation:t4 8s ease-in-out infinite}@keyframes t5{0%,30%{opacity:0;transform:none}33%{opacity:1}40%{opacity:1;transform:translate(var(--x),var(--y))}43%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t5{animation:t5 8s ease-in-out infinite}@keyframes t6{0%,37%{opacity:0;transform:none}40%{opacity:1}47%{opacity:1;transform:translate(var(--x),var(--y))}50%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t6{animation:t6 8s ease-in-out infinite}@keyframes g1{0%,48%{fill-opacity:.05}56%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3,.t4,.t5,.t6{display:none}.g1{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">Ways in, one bookmark</text><text x="10" y="42" class="m">Every route ends in the same kind of bookmark</text><rect x="10" y="60" width="108" height="92" rx="10" class="box"/><text x="64" y="82" class="c b">Quick add</text><text x="64" y="102" class="c m">&amp;</text><text x="64" y="120" class="c m">name | url</text><text x="64" y="138" class="c m">| shortcut</text><path d="M64 154V194" class="ln" marker-end="url(#h)"/><rect x="128" y="60" width="108" height="92" rx="10" class="box"/><text x="182" y="82" class="c b">Full form</text><text x="182" y="102" class="c m">+ · Shift + B</text><text x="182" y="120" class="c m">all the fields</text><text x="182" y="138" class="c m"></text><path d="M182 154V194" class="ln" marker-end="url(#h)"/><rect x="246" y="60" width="108" height="92" rx="10" class="box"/><text x="300" y="82" class="c b">Paste</text><text x="300" y="102" class="c m">Ctrl + V</text><text x="300" y="120" class="c m">a dialog: Add</text><text x="300" y="138" class="c m">or Save to Inbox</text><path d="M300 154V194" class="ln" marker-end="url(#h)"/><rect x="364" y="60" width="108" height="92" rx="10" class="box"/><text x="418" y="82" class="c b">Extension</text><text x="418" y="102" class="c m">saves the tab</text><text x="418" y="120" class="c m">as a bookmark</text><text x="418" y="138" class="c m">or to the Inbox</text><path d="M418 154V194" class="ln" marker-end="url(#h)"/><rect x="482" y="60" width="108" height="92" rx="10" class="box"/><text x="536" y="82" class="c b">Share sheet</text><text x="536" y="102" class="c m">bookmarklet</text><text x="536" y="120" class="c m">/add, into</text><text x="536" y="138" class="c m">the Inbox</text><path d="M536 154V194" class="ln" marker-end="url(#h)"/><rect x="600" y="60" width="108" height="92" rx="10" class="box"/><text x="654" y="82" class="c b">Import</text><text x="654" y="102" class="c m">file, CSV, source</text><text x="654" y="120" class="c m">or into the</text><text x="654" y="138" class="c m">Inbox first</text><path d="M654 154V194" class="ln" marker-end="url(#h)"/><rect x="10" y="196" width="700" height="112" rx="10" class="af g1"/><text x="24" y="220" class="b">The same bookmark</text><text x="24" y="242">On a page and category, or waiting in the Inbox until you Promote it with the same form</text><text x="24" y="264" class="m">The form reads the page once: icon, name, preview card and suggested tags</text><text x="24" y="284" class="m">The same address on the same page is refused; on another page you are asked. Imports skip duplicates.</text><circle cx="64" cy="158" r="5" class="dot t1" style="--x:0px;--y:36px"/><circle cx="182" cy="158" r="5" class="dot t2" style="--x:0px;--y:36px"/><circle cx="300" cy="158" r="5" class="dot t3" style="--x:0px;--y:36px"/><circle cx="418" cy="158" r="5" class="dot t4" style="--x:0px;--y:36px"/><circle cx="536" cy="158" r="5" class="dot t5" style="--x:0px;--y:36px"/><circle cx="654" cy="158" r="5" class="dot t6" style="--x:0px;--y:36px"/>
</svg>
