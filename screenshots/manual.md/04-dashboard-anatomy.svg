<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400" role="img" aria-labelledby="t d"><title id="t">Anatomy of the dashboard grid</title><desc id="d">A schematic of the dashboard: numbered parts. 1 the header with clock, date, weather and page name; 2 the page switcher; 3 the destination icons with count badges; 4 categories of bookmark rows; 5 widgets; 6 the action bar as a column on the right edge.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
