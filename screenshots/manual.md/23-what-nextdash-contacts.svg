<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 346" width="720" height="346" role="img" aria-labelledby="t d"><title id="t">What nextDash contacts</title><desc id="d">The nextDash server in the middle with nine lines going out. Solid lines are requests made when you use a feature: your bookmarks sites, your own services, weather and calendar providers, image registries. Dashed lines run on a schedule: the GitHub release check, the nextdash.cc news feed and the daily install count. Dotted lines happen only when you ask or turn them on: analytics and your assistant provider. Nothing else leaves.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs><rect x="10" y="110" width="140" height="80" rx="10" class="ac"/><text x="80" y="146" class="c b">nextDash</text><text x="80" y="166" class="c m">your install</text>
<path d="M150 150C200 150 200 24 250 24" class="ln" stroke-dasharray=""/><circle cx="254" cy="24" r="4" class="dot"/><text x="268" y="28"><tspan class="b">Your bookmarks' sites</tspan><tspan class="m"> · checks, previews, icons, feeds, archives</tspan></text><path d="M150 150C200 150 200 55 250 55" class="ln" stroke-dasharray=""/><circle cx="254" cy="55" r="4" class="dot"/><text x="268" y="59"><tspan class="b">Your own services</tspan><tspan class="m"> · custom widgets, webhooks, alerts</tspan></text><path d="M150 150C200 150 200 86 250 86" class="ln" stroke-dasharray=""/><circle cx="254" cy="86" r="4" class="dot"/><text x="268" y="90"><tspan class="b">Weather and calendar providers</tspan><tspan class="m"> · the header and widgets</tspan></text><path d="M150 150C200 150 200 117 250 117" class="ln" stroke-dasharray=""/><circle cx="254" cy="117" r="4" class="dot"/><text x="268" y="121"><tspan class="b">Image registries and GitHub</tspan><tspan class="m"> · update checks, when switched on</tspan></text><path d="M150 150C200 150 200 148 250 148" class="ln" stroke-dasharray="7 5"/><circle cx="254" cy="148" r="4" class="dot"/><text x="268" y="152"><tspan class="b">GitHub Releases</tspan><tspan class="m"> · new-version check, once a day</tspan></text><path d="M150 150C200 150 200 179 250 179" class="ln" stroke-dasharray="7 5"/><circle cx="254" cy="179" r="4" class="dot"/><text x="268" y="183"><tspan class="b">nextdash.cc</tspan><tspan class="m"> · news posts, every 90 minutes</tspan></text><path d="M150 150C200 150 200 210 250 210" class="ln" stroke-dasharray="7 5"/><circle cx="254" cy="210" r="4" class="dot"/><text x="268" y="214"><tspan class="b">stats.nextdash.cc</tspan><tspan class="m"> · install count: random id and version, daily</tspan></text><path d="M150 150C200 150 200 241 250 241" class="ln" stroke-dasharray="2 5"/><circle cx="254" cy="241" r="4" class="dot"/><text x="268" y="245"><tspan class="b">stats.nextdash.cc</tspan><tspan class="m"> · analytics, off until you turn it on</tspan></text><path d="M150 150C200 150 200 272 250 272" class="ln" stroke-dasharray="2 5"/><circle cx="254" cy="272" r="4" class="dot"/><text x="268" y="276"><tspan class="b">Your assistant provider</tspan><tspan class="m"> · only when you ask a question</tspan></text>
<path d="M10 316H50" class="ln"/><text x="58" y="320" class="m">when you use the feature</text>
<path d="M270 316H310" class="ln" stroke-dasharray="7 5"/><text x="318" y="320" class="m">on a schedule</text>
<path d="M440 316H480" class="ln" stroke-dasharray="2 5"/><text x="488" y="320" class="m">only when you ask or turn it on</text></svg>
