<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d"><title id="t">How a link moves through the inbox</title><desc id="d">A link comes in by paste, the browser extension, the share sheet, bookmarklet or add address, the API, app discovery or an import into the inbox. It waits in the inbox with no limit, stored in data inbox.json. Triage then takes one link at a time: Promote with the p key files it on a category on a page, Keep with Shift and K sends it to Bookmarks, Unsorted, off the dashboard, and Delete with d removes it, with undo in the toast. One link travels in; at rest all three exits are lit.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,4%{opacity:0;transform:none}7%{opacity:1}26%{opacity:1;transform:translate(var(--x),var(--y))}29%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,32%{opacity:0;transform:none}35%{opacity:1}56%{opacity:1;transform:translate(var(--x),var(--y))}59%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes g1{0%,54%{fill-opacity:.05}62%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}@keyframes g2{0%,54%{fill-opacity:.05}62%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g2{animation:g2 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2{display:none}.g1,.g2{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">Into the inbox, and out of it</text><text x="10" y="42" class="m">One link, six ways in, three ways out</text><rect x="10" y="60" width="214" height="28" rx="14" class="box"/><text x="24" y="79">Paste a URL</text><path d="M226 74C246 74 240 148 258 148" class="ln"/><rect x="10" y="94" width="214" height="28" rx="14" class="box"/><text x="24" y="113">Browser extension</text><path d="M226 108C246 108 240 148 258 148" class="ln"/><rect x="10" y="128" width="214" height="28" rx="14" class="box"/><text x="24" y="147">Share sheet · bookmarklet</text><path d="M226 142C246 142 240 148 258 148" class="ln"/><rect x="10" y="162" width="214" height="28" rx="14" class="box"/><text x="24" y="181">The API</text><path d="M226 176C246 176 240 148 258 148" class="ln"/><rect x="10" y="196" width="214" height="28" rx="14" class="box"/><text x="24" y="215">App discovery</text><path d="M226 210C246 210 240 148 258 148" class="ln"/><rect x="10" y="230" width="214" height="28" rx="14" class="box"/><text x="24" y="249">An import, into the inbox</text><path d="M226 244C246 244 240 148 258 148" class="ln"/><rect x="260" y="88" width="150" height="120" rx="10" class="ac"/><text x="335" y="114" class="c b">The Inbox</text><text x="335" y="134" class="c m">waits here, no limit</text><text x="335" y="156" class="c mono m">data/inbox.json</text><text x="335" y="182" class="c m">Triage: t</text><text x="335" y="198" class="c m">one link at a time</text><path d="M412 148C440 148 430 88 466 88" class="ln" marker-end="url(#h)"/><rect x="468" y="60" width="242" height="56" rx="10" class="af g1"/><text x="480" y="82" class="b">Promote</text><text x="698" y="82" class="mono m" text-anchor="end">p</text><text x="480" y="102" class="m">A category on a page</text><path d="M412 148C440 148 430 160 466 160" class="ln" marker-end="url(#h)"/><rect x="468" y="132" width="242" height="56" rx="10" class="af g2"/><text x="480" y="154" class="b">Keep</text><text x="698" y="154" class="mono m" text-anchor="end">Shift + K</text><text x="480" y="174" class="m">Bookmarks › Unsorted</text><path d="M412 148C440 148 430 232 466 232" class="ln" marker-end="url(#h)"/><rect x="468" y="204" width="242" height="56" rx="10" class="box g3"/><text x="480" y="226" class="b">Delete</text><text x="698" y="226" class="mono m" text-anchor="end">d</text><text x="480" y="246" class="m">Gone; undo in the toast</text><text x="10" y="284" class="m">Keep takes a link to a hidden page, off the dashboard; Promote on it files it on a real page later.</text><rect x="190" y="75" width="20" height="12" rx="3" class="dot t1" style="--x:62px;--y:60px"/><rect x="410" y="142" width="20" height="12" rx="3" class="dot t2" style="--x:62px;--y:-62px"/>
</svg>
