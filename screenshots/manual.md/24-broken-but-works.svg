<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 434" width="720" height="434" role="img" aria-labelledby="t d"><title id="t">Broken, but the site works</title><desc id="d">A decision tree with six nodes. A bookmark shows broken although the site opens for you. Open its Health tab and read the stored cause. For an HTTP 401 or a sign-in page, use Expected response: add 401 to the healthy status codes or pick a stored sign-in. For TLS, such as a self-signed certificate, tick Accept a certificate this machine does not trust. For Content, change the text the page must contain or clear both test fields. For DNS, timeout or refused, switch on Allow localhost and private-network bookmarks if the address is on your own network, or raise the check timeout between 5 and 30 seconds. Just after a start, and with no connection from the server, failures are held back and nothing is marked broken.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">Broken in nextDash, fine in your browser</text><rect x="130" y="36" width="460" height="44" rx="10" class="af"/><text x="360" y="63" class="c b">The bookmark shows broken, the site opens for you</text><path d="M360 82V104" class="ln" marker-end="url(#h)"/><rect x="200" y="106" width="320" height="52" rx="10" class="box"/><text x="360" y="128" class="c b">Open its Health tab: what is the cause?</text><text x="360" y="146" class="c m">a failure stores DNS, timeout, refused, TLS, …</text><path d="M360 160C360 176 92 170 92 190" class="ln" marker-end="url(#h)"/><rect x="10" y="192" width="165" height="40" rx="8" class="box"/><text x="97" y="210" class="c b">An HTTP 401</text><text x="97" y="225" class="c m">or a sign-in page</text><rect x="10" y="244" width="165" height="88" rx="8" class="af"/><text x="20" y="264">Expected response: add</text><text x="20" y="282">401 to the healthy</text><text x="20" y="300">status codes, or pick</text><text x="20" y="318">a stored sign-in</text><path d="M360 160C360 176 267 170 267 190" class="ln" marker-end="url(#h)"/><rect x="185" y="192" width="165" height="40" rx="8" class="box"/><text x="272" y="210" class="c b">TLS</text><text x="272" y="225" class="c m">self-signed certificate</text><rect x="185" y="244" width="165" height="70" rx="8" class="af"/><text x="195" y="264">Tick Accept a</text><text x="195" y="282">certificate this</text><text x="195" y="300">machine does not trust</text><path d="M360 160C360 176 442 170 442 190" class="ln" marker-end="url(#h)"/><rect x="360" y="192" width="165" height="40" rx="8" class="box"/><text x="447" y="210" class="c b">Content</text><text x="447" y="225" class="c m">a text test fails</text><rect x="360" y="244" width="165" height="88" rx="8" class="af"/><text x="370" y="264">Expected response:</text><text x="370" y="282">change the text the</text><text x="370" y="300">page must contain, or</text><text x="370" y="318">clear both test fields</text><path d="M360 160C360 176 617 170 617 190" class="ln" marker-end="url(#h)"/><rect x="535" y="192" width="165" height="40" rx="8" class="box"/><text x="622" y="210" class="c b">No answer</text><text x="622" y="225" class="c m">DNS, timeout, refused</text><rect x="535" y="244" width="165" height="124" rx="8" class="af"/><text x="545" y="264">Own network? Switch on</text><text x="545" y="282">Allow localhost &amp;</text><text x="545" y="300">private-network</text><text x="545" y="318">bookmarks. Slow site?</text><text x="545" y="336">Raise the check</text><text x="545" y="354">timeout (5–30 s)</text><text x="10" y="386" class="m">Just after a start the first failed check is held back for 15 minutes, and a server with no connection holds its failures</text><text x="10" y="404" class="m">back for up to half an hour. Nothing is marked broken then; Retest all after a start records at once.</text><text x="10" y="422" class="m">NEXTDASH_HEALTH_STARTUP_GRACE sets the first window.</text>
</svg>
