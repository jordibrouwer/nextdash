<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 342" width="720" height="342" role="img" aria-labelledby="t d"><title id="t">How a check decides</title><desc id="d">A check asks the address and runs through up to three gates. First the request: no answer from DNS, a timeout, a refused connection or TLS is recorded as a cause, tried again five seconds later, and gives Broken. Then the status code must be on your list of healthy codes, by default anything below 500; otherwise it is Broken with an HTTP status. Then the optional page text test, a phrase the page must contain or must not contain; if it fails the bookmark goes to the Content filter, not Broken. A robot check or rate limit reads as Unknown. If all gates pass the bookmark is healthy. A request travels along the gates; at rest the healthy verdict is lit.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,4%{opacity:0;transform:none}7%{opacity:1}22%{opacity:1;transform:translate(var(--x),var(--y))}25%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,24%{opacity:0;transform:none}27%{opacity:1}40%{opacity:1;transform:translate(var(--x),var(--y))}43%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes t3{0%,42%{opacity:0;transform:none}45%{opacity:1}58%{opacity:1;transform:translate(var(--x),var(--y))}61%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t3{animation:t3 8s ease-in-out infinite}@keyframes g1{0%,60%{fill-opacity:.05}68%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3{display:none}.g1{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">How a check decides a status</text><text x="10" y="42" class="m">Request, status code, page text: pass all three and it is healthy</text><rect x="10" y="60" width="160" height="96" rx="10" class="ac"/><text x="90" y="82" class="c b">The request</text><text x="90" y="104" class="c m">The server asks</text><text x="90" y="120" class="c m">the address, within</text><text x="90" y="136" class="c m">the check timeout</text><rect x="200" y="60" width="160" height="96" rx="10" class="ac"/><text x="280" y="82" class="c b">Status code</text><text x="280" y="104" class="c m">Must be on your list;</text><text x="280" y="120" class="c m">by default anything</text><text x="280" y="136" class="c m">below 500 counts</text><rect x="390" y="60" width="160" height="96" rx="10" class="ac"/><text x="470" y="82" class="c b">Page text</text><text x="470" y="104" class="c m">Must contain a phrase,</text><text x="470" y="120" class="c m">or must not (fail if</text><text x="470" y="136" class="c m">present). Optional</text><path d="M172 108H198" class="ln" marker-end="url(#h)"/><path d="M362 108H388" class="ln" marker-end="url(#h)"/><path d="M552 108H578" class="ln" marker-end="url(#h)"/><rect x="580" y="60" width="130" height="96" rx="10" class="af g1"/><text x="645" y="92" class="c b">Healthy</text><text x="645" y="114" class="c m">all passed</text><text x="645" y="132" class="c m">Healthy filter</text><path d="M90 158V196" class="ln" marker-end="url(#h)"/><text x="96" y="182" class="m">fails</text><rect x="10" y="198" width="160" height="82" rx="10" class="box"/><rect x="10" y="198" width="160" height="26" rx="10" class="bad" fill-opacity=".18"/><text x="90" y="216" class="c b">Broken</text><text x="90" y="244" class="c m">No answer: DNS,</text><text x="90" y="260" class="c m">timeout, refused or TLS.</text><text x="90" y="276" class="c m">Tried again 5 s later</text><path d="M280 158V196" class="ln" marker-end="url(#h)"/><text x="286" y="182" class="m">fails</text><rect x="200" y="198" width="160" height="82" rx="10" class="box"/><rect x="200" y="198" width="160" height="26" rx="10" class="bad" fill-opacity=".18"/><text x="280" y="216" class="c b">Broken</text><text x="280" y="244" class="c m">An HTTP status not</text><text x="280" y="260" class="c m">on the list, such as</text><text x="280" y="276" class="c m">502 or 404</text><path d="M470 158V196" class="ln" marker-end="url(#h)"/><text x="476" y="182" class="m">fails</text><rect x="390" y="198" width="160" height="82" rx="10" class="box"/><rect x="390" y="198" width="160" height="26" rx="10" class="bad" fill-opacity=".18"/><text x="470" y="216" class="c b">Content filter</text><text x="470" y="244" class="c m">The text test failed.</text><text x="470" y="260" class="c m">Not Broken. Clear both</text><text x="470" y="276" class="c m">fields to clear it</text><text x="10" y="308" class="m">A robot check, a rate limit or anything unclear reads as Unknown, not Broken.</text><text x="10" y="326" class="m">A page that still answers but changed is flagged as drift, which is a separate switch, not a verdict.</text><circle cx="10" cy="108" r="6" class="dot t1" style="--x:170px;--y:0px"/><circle cx="10" cy="108" r="6" class="dot t2" style="--x:360px;--y:0px"/><circle cx="10" cy="108" r="6" class="dot t3" style="--x:560px;--y:0px"/>
</svg>
