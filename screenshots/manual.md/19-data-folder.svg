<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 330" width="720" height="330" role="img" aria-labelledby="t d"><title id="t">What is in the data folder and what a backup carries</title><desc id="d">The data folder holds readable JSON files such as bookmarks.json, settings.json and inbox.json. In three groups: what every backup carries, what only travels if you switch it on (local copies of pages, tokens and passwords), and what is never in a backup (cached previews, the health cache, push subscriptions, icon sets, stored backups). Below it, deleted items wait in the trash for 30 days, and only data/icons/ is served to browsers.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs><rect x="10" y="10" width="700" height="62" rx="10" class="ac"/><text x="26" y="36" class="mono b">data/</text><text x="80" y="36">your whole library, in plain files you can open</text>
<text x="26" y="58" class="mono m">bookmarks.json · inbox.json · settings.json · finders.json · health-history.json · icons/</text>
<rect x="10" y="86" width="226" height="190" rx="10" class="af"/><text x="24" y="110" class="b">In every backup</text><text x="24" y="128" class="m">the ZIP and the stored ones</text><text x="24" y="154"><tspan class="a">·</tspan> bookmarks, pages, categories</text><text x="24" y="176"><tspan class="a">·</tspan> inbox and finders</text><text x="24" y="198"><tspan class="a">·</tspan> settings and custom themes</text><text x="24" y="220"><tspan class="a">·</tspan> check history</text><text x="24" y="242"><tspan class="a">·</tspan> icons and uploads</text><text x="24" y="264"><tspan class="a">·</tspan> the assistant's chats</text>
<rect x="247" y="86" width="226" height="190" rx="10" class="box"/><text x="261" y="110" class="b">Only if you switch it on</text><text x="261" y="128" class="m">two switches under Protect</text><text x="261" y="154"><tspan class="a">·</tspan> local copies of pages</text><text x="261" y="176"><tspan class="a">·</tspan> tokens and passwords</text><text x="261" y="198"><tspan class="a">·</tspan> sign-ins, webhook keys, sources</text><text x="261" y="220"><tspan class="a">·</tspan> (blanked out otherwise)</text>
<rect x="484" y="86" width="226" height="190" rx="10" class="ln"/><text x="498" y="110" class="b">Never in a backup</text><text x="498" y="128" class="m">rebuilt after a restore</text><text x="498" y="154"><tspan class="a">·</tspan> cached previews, pictures</text><text x="498" y="176"><tspan class="a">·</tspan> the health cache</text><text x="498" y="198"><tspan class="a">·</tspan> browser push subscriptions</text><text x="498" y="220"><tspan class="a">·</tspan> icon-sets/ and auto-backups/</text>
<text x="10" y="302" class="b">Trash</text><text x="52" y="302">deleted bookmarks, pages and categories wait 30 days.</text>
<text x="10" y="322" class="m">Browsers are served only data/icons/ and an uploaded favicon or font; the rest is reachable through the API.</text></svg>
