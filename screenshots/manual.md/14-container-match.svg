<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 338" width="720" height="338" role="img" aria-labelledby="t d"><title id="t">How a container finds its bookmark</title><desc id="d">For a container such as sonarr, nextDash tries four steps in order and stops at the first step that finds exactly one address: the bookmark chosen in the container side panel, or none if No bookmark was chosen; a bookmark on the same port of this server; a bookmark whose subdomain is the container name; a bookmark titled after the container. Two matches at one step is no guess. Once linked, the container row shows a bookmark mark in the colour of its checks: green when they pass, red when broken or down, an outline when nothing checks it. The bookmark row shows a cube in the container state and its side panel Details, Address, Runs in links back. The steps appear one by one; at rest all are shown.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes q1{0%,2%{opacity:0;transform:translateX(-22px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q1{animation:q1 8s ease infinite}@keyframes q2{0%,12%{opacity:0;transform:translateX(-22px)}16%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q2{animation:q2 8s ease infinite}@keyframes q3{0%,22%{opacity:0;transform:translateX(-22px)}26%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q3{animation:q3 8s ease infinite}@keyframes q4{0%,32%{opacity:0;transform:translateX(-22px)}36%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q4{animation:q4 8s ease infinite}@keyframes q5{0%,50%{opacity:0;transform:translateX(-22px)}54%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q5{animation:q5 8s ease infinite}
@media (prefers-reduced-motion:reduce){.q1,.q2,.q3,.q4,.q5{animation:none!important;opacity:1!important;transform:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">Which bookmark belongs to a container</text><text x="10" y="42" class="m">nextDash looks in this order and stops at the first step that finds exactly one; two at one step is no guess</text><rect x="10" y="100" width="110" height="80" rx="10" class="ac"/><text x="65" y="126" class="c m">Container</text><text x="65" y="148" class="c b">sonarr</text><text x="65" y="166" class="c m">port 8989</text><g class="q1"><rect x="160" y="62" width="290" height="46" rx="8" class="box"/><circle cx="182" cy="85" r="10" class="nb"/><text x="182" y="89" class="nt">1</text><text x="204" y="81" class="b">The bookmark you chose</text><text x="204" y="99" class="m">in its side panel, or No bookmark</text></g><g class="q2"><rect x="160" y="118" width="290" height="46" rx="8" class="box"/><circle cx="182" cy="141" r="10" class="nb"/><text x="182" y="145" class="nt">2</text><text x="204" y="137" class="b">A bookmark on the same port</text><text x="204" y="155" class="m">of this server</text></g><g class="q3"><rect x="160" y="174" width="290" height="46" rx="8" class="box"/><circle cx="182" cy="197" r="10" class="nb"/><text x="182" y="201" class="nt">3</text><text x="204" y="193" class="b">A subdomain named after it</text><text x="204" y="211" class="m">sonarr.example.com</text></g><g class="q4"><rect x="160" y="230" width="290" height="46" rx="8" class="box"/><circle cx="182" cy="253" r="10" class="nb"/><text x="182" y="257" class="nt">4</text><text x="204" y="249" class="b">A bookmark titled after it</text><text x="204" y="267" class="m">sonarr</text></g><path d="M122 140C140 140 138 85 158 85M122 140H158M122 140C140 140 138 197 158 197M122 140C140 140 138 253 158 253" class="ln"/><g class="q5"><path d="M452 140C472 140 470 120 490 120M452 140C472 140 470 246 490 254" class="ln"/><rect x="492" y="62" width="218" height="130" rx="10" class="af"/><text x="504" y="84" class="b">On the container row</text><text x="504" y="102" class="m">a bookmark mark in the colour</text><text x="504" y="118" class="m">of its checks:</text><circle cx="512" cy="138" r="6" class="dot"/><text x="524" y="142" class="m">green: they pass</text><circle cx="512" cy="156" r="6" class="bad"/><text x="524" y="160" class="m">red: broken or down</text><circle cx="512" cy="174" r="5" class="ln"/><text x="524" y="178" class="m">outline: nothing checks it</text><rect x="492" y="206" width="218" height="96" rx="10" class="af"/><text x="504" y="228" class="b">On the bookmark</text><text x="504" y="246" class="m">a cube in the container’s state</text><text x="504" y="268" class="m">Details › Address › Runs in</text><text x="504" y="286" class="m">links back to the container</text></g><text x="160" y="322" class="m">Wrong guess? Choose the bookmark by hand under Bookmark › Linked bookmark.</text>
</svg>
