<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 352" width="720" height="352" role="img" aria-labelledby="t d"><title id="t">The layers of a look</title><desc id="d">A look is five layers, from the top down: the theme (palette and its light or dark half), the material (how surfaces are built, in the Signature or Classic style), the surface (depth and category surface), the effects (glow and effects) and the backdrop (the theme backdrop, a pattern and your own background). Material, depth, glow, effects, category surface and backdrop start on Follow the theme; changing one belongs to the theme you are on, and Use these for every theme holds one answer for the whole install. The layers slide in one by one; with reduced motion all five are shown at rest.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes q1{0%,2%{opacity:0;transform:translateX(-22px)}6%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q1{animation:q1 8s ease infinite}@keyframes q2{0%,12%{opacity:0;transform:translateX(-22px)}16%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q2{animation:q2 8s ease infinite}@keyframes q3{0%,22%{opacity:0;transform:translateX(-22px)}26%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q3{animation:q3 8s ease infinite}@keyframes q4{0%,32%{opacity:0;transform:translateX(-22px)}36%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q4{animation:q4 8s ease infinite}@keyframes q5{0%,42%{opacity:0;transform:translateX(-22px)}46%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q5{animation:q5 8s ease infinite}@keyframes q6{0%,55%{opacity:0;transform:translateX(-22px)}59%,88%{opacity:1;transform:none}96%,100%{opacity:0;transform:translateX(-22px)}}.q6{animation:q6 8s ease infinite}
@media (prefers-reduced-motion:reduce){.q1,.q2,.q3,.q4,.q5,.q6{animation:none!important;opacity:1!important;transform:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">The layers of a look</text><text x="10" y="42" class="m">Five layers from the top down; each is its own setting</text><g class="q1"><rect x="10" y="60" width="450" height="46" rx="8" class="box"/><circle cx="30" cy="83" r="10" class="nb"/><text x="30" y="87" class="nt">1</text><text x="52" y="79" class="b">Theme</text><text x="450" y="79" class="m" text-anchor="end" dx="-10">Theme tab</text><text x="52" y="97" class="m">Palette, light or dark half · 190+ families</text></g><g class="q2"><rect x="10" y="116" width="450" height="46" rx="8" class="box"/><circle cx="30" cy="139" r="10" class="nb"/><text x="30" y="143" class="nt">2</text><text x="52" y="135" class="b">Material</text><text x="450" y="135" class="m" text-anchor="end" dx="-10">Signature · Classic</text><text x="52" y="153" class="m">How surfaces are built: Glass, Frost, Neon, Paper …</text></g><g class="q3"><rect x="10" y="172" width="450" height="46" rx="8" class="box"/><circle cx="30" cy="195" r="10" class="nb"/><text x="30" y="199" class="nt">3</text><text x="52" y="191" class="b">Surface</text><text x="450" y="191" class="m" text-anchor="end" dx="-10">Depth · Category surface</text><text x="52" y="209" class="m">What categories and widgets sit on, and how deep</text></g><g class="q4"><rect x="10" y="228" width="450" height="46" rx="8" class="box"/><circle cx="30" cy="251" r="10" class="nb"/><text x="30" y="255" class="nt">4</text><text x="52" y="247" class="b">Effects</text><text x="450" y="247" class="m" text-anchor="end" dx="-10">Glow · Effects</text><text x="52" y="265" class="m">Shine, glow, grain and how round the corners are</text></g><g class="q5"><rect x="10" y="284" width="450" height="46" rx="8" class="af"/><circle cx="30" cy="307" r="10" class="nb"/><text x="30" y="311" class="nt">5</text><text x="52" y="303" class="b">Backdrop</text><text x="450" y="303" class="m" text-anchor="end" dx="-10">Backdrop · Pattern</text><text x="52" y="321" class="m">Behind the bookmarks: the theme’s, a pattern, your own</text></g><g class="q6"><rect x="486" y="60" width="224" height="284" rx="10" class="ac"/><text x="500" y="84" class="a b">Follow the theme</text><text x="500" y="108" class="m">Material, depth, glow, effects,</text><text x="500" y="126" class="m">the category surface and the</text><text x="500" y="144" class="m">backdrop start on this answer:</text><text x="500" y="162" class="m">the theme says how it was</text><text x="500" y="180" class="m">drawn.</text><text x="500" y="198" class="m"></text><text x="500" y="216" class="m">Change one and it belongs to</text><text x="500" y="234" class="m">the theme you are on; every</text><text x="500" y="252" class="m">other theme keeps its own.</text><text x="500" y="270" class="m"></text><text x="500" y="288" class="m">Use these for every theme</text><text x="500" y="306" class="m">holds one answer for all of</text><text x="500" y="324" class="m">them instead.</text></g>
</svg>
