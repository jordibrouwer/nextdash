<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d"><title id="t">How a capture reaches nextDash</title><desc id="d">The page you are on is saved by the nextDash Bookmark Saver extension, which sends it to your nextDash address from its Settings together with the write token if the server has one. It lands as a bookmark on the page and category you chose, or in the inbox. Keys are Ctrl or Cmd with Shift and Y for a bookmark and Shift and U for the inbox. The icon badge shows plus for saved, D for already there, a question mark for no server set and an exclamation mark for failed; errors are 401 for a wrong or missing write token, 403 for an origin not allowed and 409 for a shortcut already used. Small dots travel along the arrows; at rest both destinations are lit.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,4%{opacity:0;transform:none}7%{opacity:1}16%{opacity:1;transform:translate(var(--x),var(--y))}19%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,20%{opacity:0;transform:none}23%{opacity:1}32%{opacity:1;transform:translate(var(--x),var(--y))}35%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes t3{0%,36%{opacity:0;transform:none}39%{opacity:1}50%{opacity:1;transform:translate(var(--x),var(--y))}53%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t3{animation:t3 8s ease-in-out infinite}@keyframes g1{0%,46%{fill-opacity:.05}54%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}@keyframes g2{0%,46%{fill-opacity:.05}54%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g2{animation:g2 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3{display:none}.g1,.g2{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">From a tab to your server</text><text x="10" y="42" class="m">The extension needs no CORS setting: its origin is always allowed</text><rect x="10" y="64" width="120" height="96" rx="10" class="box"/><text x="70" y="90" class="c b">A page</text><text x="70" y="110" class="c m">in your browser</text><text x="70" y="130" class="c m">title and URL</text><text x="70" y="146" class="c m">filled in</text><path d="M132 112H188" class="ln" marker-end="url(#h)"/><rect x="190" y="64" width="140" height="96" rx="10" class="ac"/><text x="260" y="88" class="c b">The extension</text><text x="260" y="108" class="c m">Bookmark Saver</text><text x="260" y="128" class="c m">popup, right-click,</text><text x="260" y="144" class="c m">or a keyboard key</text><path d="M332 112H388" class="ln" marker-end="url(#h)"/><text x="360" y="98" class="c m">write</text><text x="360" y="132" class="c m">token</text><rect x="390" y="64" width="140" height="96" rx="10" class="ac"/><text x="460" y="88" class="c b">Your nextDash</text><text x="460" y="108" class="c b">server</text><text x="460" y="128" class="c m">address from</text><text x="460" y="144" class="c m">the Settings</text><path d="M532 100C552 100 548 74 568 74" class="ln" marker-end="url(#h)"/><path d="M532 124C552 124 548 150 568 150" class="ln" marker-end="url(#h)"/><rect x="570" y="50" width="140" height="52" rx="10" class="af g1"/><text x="580" y="72" class="b">Page and category</text><text x="580" y="90" class="m">Save as bookmark</text><rect x="570" y="122" width="140" height="52" rx="10" class="af g2"/><text x="580" y="144" class="b">The Inbox</text><text x="580" y="162" class="m">Save to Inbox</text><text x="10" y="204" class="m">Keys: Ctrl/Cmd + Shift + Y saves as a bookmark, Ctrl/Cmd + Shift + U to the inbox</text><text x="10" y="224" class="m">Badge on the icon: + saved · D already there · ? no server set · ! failed</text><text x="10" y="244" class="m">Errors: 401 wrong or missing write token · 403 origin not allowed · 409 shortcut already used</text><text x="10" y="264" class="m">With no write token set on the server, none is needed. An open dashboard tab refreshes itself.</text><circle cx="132" cy="112" r="5" class="dot t1" style="--x:56px;--y:0px"/><circle cx="332" cy="112" r="5" class="dot t2" style="--x:56px;--y:0px"/><circle cx="532" cy="100" r="5" class="dot t3" style="--x:36px;--y:-26px"/><circle cx="532" cy="124" r="5" class="dot t3" style="--x:36px;--y:26px"/>
</svg>
