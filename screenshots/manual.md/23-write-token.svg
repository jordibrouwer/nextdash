<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 384" width="720" height="384" role="img" aria-labelledby="t d"><title id="t">What the write token gates</title><desc id="d">With NEXTDASH_WRITE_TOKEN set, reading stays open: bookmarks, settings without the stored keys and tokens, the health list and ping, and the icons folder with an uploaded favicon or font. Everything that writes needs the X-NextDash-Token header: saves, imports, deletes, uploads, resets, retests, preview fetches and container actions, backups, the server log and the stored keys and tokens in settings. The rest of the data folder is never served. The dashboard supplies the token itself, so the token is not a login; it keeps out other websites and scripts that only know the address. A request without the token is stopped at the gate; one with it passes.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,4%{opacity:0;transform:none}7%{opacity:1}14%{opacity:1;transform:translate(var(--x),var(--y))}17%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,18%{opacity:0;transform:none}21%{opacity:1}26%{opacity:1;transform:translate(var(--x),var(--y))}29%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes t3{0%,27%{opacity:0;transform:none}30%{opacity:1}40%{opacity:1;transform:translate(var(--x),var(--y))}43%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t3{animation:t3 8s ease-in-out infinite}@keyframes t4{0%,46%{opacity:0;transform:none}49%{opacity:1}62%{opacity:1;transform:translate(var(--x),var(--y))}65%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t4{animation:t4 8s ease-in-out infinite}@keyframes g1{0%,10%{fill-opacity:.05}18%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3,.t4{display:none}.g1{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">What the write token gates</text><text x="10" y="42" class="m">When NEXTDASH_WRITE_TOKEN is set. Unset, nothing needs a token.</text><rect x="10" y="130" width="100" height="70" rx="10" class="box"/><text x="60" y="160" class="c b">A request</text><text x="60" y="180" class="c m">to the server</text><path d="M112 150C150 150 150 100 226 100" class="ln" marker-end="url(#h)"/><path d="M112 180C150 180 150 230 226 230" class="ln" marker-end="url(#h)"/><rect x="228" y="58" width="482" height="90" rx="10" class="af g1"/><text x="242" y="82" class="a b">Open without the token</text><text x="242" y="102">Reading: bookmarks, settings, the health list, ping</text><text x="242" y="120" class="m">Settings come back without the stored keys and tokens</text><text x="242" y="138" class="m">Icons in data/icons/, an uploaded favicon or font</text><rect x="228" y="168" width="482" height="132" rx="10" class="ac"/><text x="242" y="192" class="b">Needs the header X-NextDash-Token</text><text x="242" y="212">Writes: saves, imports, deletes, uploads, resets</text><text x="242" y="230">Retests, preview fetches, container actions</text><text x="242" y="248">Backups: GET /api/backup and the automatic-backup routes</text><text x="242" y="266">The server log, and the stored keys and tokens in settings</text><text x="242" y="286" class="m">The rest of data/ is not served; only the API reaches it</text><rect x="122" y="216" width="66" height="24" rx="12" class="box"/><text x="155" y="233" class="c m b">token</text><circle cx="112" cy="150" r="5" class="dot t1" style="--x:70px;--y:-40px"/><circle cx="112" cy="180" r="5" class="bad t2" style="--x:34px;--y:20px"/><path d="M200 218l10 10m0-10l-10 10" class="ln badl t3" style="stroke-width:3"/><circle cx="112" cy="180" r="5" class="dot t4" style="--x:112px;--y:50px"/><text x="10" y="330" class="m">The dashboard supplies the token itself, so every browser that opens it has it. The token keeps out other websites</text><text x="10" y="348" class="m">and scripts that only know the address. It is not a login: it does not keep out a person who can open</text><text x="10" y="366" class="m">the dashboard. NEXTDASH_CAPTURE_TOKEN opens only the two capture routes (/add and the share route).</text>
</svg>
