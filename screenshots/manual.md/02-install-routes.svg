<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 344" width="720" height="344" role="img" aria-labelledby="t d"><title id="t">Install routes and the data folder</title><desc id="d">Three ways to install nextDash end in the same place. Docker Compose, the recommended route, pulls the ghcr.io image and mounts the folder data as app data. Unraid, through Community Applications, uses an AppData folder, by default mnt user appdata nextdash. Building from source runs the binary with a data folder next to it, or the folder named by NEXTDASH_DATA_DIR. That data folder holds your bookmarks, inbox, settings, icons and backups; in Docker keep it on a mounted volume. Dots travel from each route to the folder; at rest it is lit.</desc><style>text{font:13px system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#1f2a25}
.m{fill:#5b6561}.b{font-weight:600}.mono{white-space:pre;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}.c{text-anchor:middle}
.a{fill:#2f7d55}.big{font-size:20px;font-weight:700}
.box{fill:#8a9490;fill-opacity:.1;stroke:#8a9490;stroke-width:1.5}
.ln{fill:none;stroke:#8a9490;stroke-width:1.5}
.ac{fill:none;stroke:#2f7d55;stroke-width:2}
.af{fill:#2f7d55;fill-opacity:.18;stroke:#2f7d55;stroke-width:1.5}
.dot{fill:#2f7d55}.mk{fill:#8a9490}.gd{fill:#8a9490;fill-opacity:.55}
.bad{fill:#b4493f}.badl{stroke:#b4493f}
.nb{fill:#2f7d55}.nt{fill:#fff;font-weight:700;font-size:12px;text-anchor:middle}
@media (prefers-color-scheme:dark){text{fill:#e6ebe8}.m{fill:#a9b3af}.a{fill:#72ca9d}.ac{stroke:#72ca9d}.af{fill:#72ca9d;stroke:#72ca9d}.dot{fill:#72ca9d}.bad{fill:#e8847a}.badl{stroke:#e8847a}.nb{fill:#72ca9d}.nt{fill:#12201a}}
@keyframes t1{0%,4%{opacity:0;transform:none}7%{opacity:1}16%{opacity:1;transform:translate(var(--x),var(--y))}19%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t1{animation:t1 8s ease-in-out infinite}@keyframes t2{0%,18%{opacity:0;transform:none}21%{opacity:1}30%{opacity:1;transform:translate(var(--x),var(--y))}33%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t2{animation:t2 8s ease-in-out infinite}@keyframes t3{0%,32%{opacity:0;transform:none}35%{opacity:1}44%{opacity:1;transform:translate(var(--x),var(--y))}47%,100%{opacity:0;transform:translate(var(--x),var(--y))}}.t3{animation:t3 8s ease-in-out infinite}@keyframes g1{0%,46%{fill-opacity:.05}54%,92%{fill-opacity:.2}100%{fill-opacity:.05}}.g1{animation:g1 8s ease infinite}
@media (prefers-reduced-motion:reduce){.t1,.t2,.t3{display:none}.g1{animation:none!important}}</style><defs><marker id="h" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L8 4L0 8z" class="mk"/></marker></defs>
<text x="10" y="22" class="b">Three ways to install, one place for your data</text><rect x="10" y="40" width="330" height="78" rx="10" class="box"/><text x="24" y="62" class="b">Docker Compose</text><text x="326" y="62" class="m" text-anchor="end">recommended</text><text x="24" y="84" class="m">image ghcr.io/jordibrouwer/nextdash:latest</text><text x="24" y="104">volume ./data:/app/data</text><path d="M342 79C390 79 380 150 424 150" class="ln" marker-end="url(#h)"/><rect x="10" y="132" width="330" height="78" rx="10" class="box"/><text x="24" y="154" class="b">Unraid</text><text x="326" y="154" class="m" text-anchor="end">Community Applications</text><text x="24" y="176" class="m">Apps → nextDash → Install → Apply</text><text x="24" y="196">AppData /mnt/user/appdata/nextdash/</text><path d="M342 171C390 171 380 150 424 150" class="ln" marker-end="url(#h)"/><rect x="10" y="224" width="330" height="78" rx="10" class="box"/><text x="24" y="246" class="b">Build from source</text><text x="326" y="246" class="m" text-anchor="end"></text><text x="24" y="268" class="m">go build -o nextDash &amp;&amp; ./nextDash</text><text x="24" y="288">data in ./data, or NEXTDASH_DATA_DIR</text><path d="M342 263C390 263 380 150 424 150" class="ln" marker-end="url(#h)"/><rect x="426" y="84" width="284" height="132" rx="10" class="af g1"/><text x="440" y="112" class="mono big a">data/</text><text x="440" y="138">Your bookmarks, inbox, settings,</text><text x="440" y="156">icons and backups</text><text x="440" y="180" class="m">In Docker, keep it on a mounted</text><text x="440" y="198" class="m">volume, or backups are lost.</text><text x="10" y="328" class="m">Never delete ./data while the container runs: the container keeps writing into a folder that is gone.</text><circle cx="342" cy="79" r="5" class="dot t1" style="--x:82px;--y:71px"/><circle cx="342" cy="171" r="5" class="dot t2" style="--x:82px;--y:-21px"/><circle cx="342" cy="263" r="5" class="dot t3" style="--x:82px;--y:-113px"/>
</svg>
